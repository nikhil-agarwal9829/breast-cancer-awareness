# Azure CLI Configuration File
# This file configures Azure resources for the application

name: breast-cancer-awareness-app
location: eastus
resourceGroup: rg-breast-cancer-awareness

services:
  web:
    host: appservice
    language: node
    version: '18'
    runtime: nodejs
    port: 3001
    build:
      - npm install
      - npm run build
    env:
      - NODE_ENV=production
      - PORT=3001

# Azure App Service Configuration
appService:
  plan: Basic
  sku: B1
  os: Linux
  runtime: NODE|18-lts

# Application Insights
monitoring:
  enabled: true
  instrumentationKey: ${APPINSIGHTS_INSTRUMENTATIONKEY}

# Database Configuration (if using Azure Cosmos DB)
database:
  type: cosmosdb
  api: mongodb
  enabled: false

# Storage Account (for file uploads)
storage:
  enabled: true
  accountType: Standard_LRS

